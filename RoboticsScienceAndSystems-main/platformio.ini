[platformio]
src_dir = StampC3_Template

[env:stampc3]
platform = espressif32@6.8.1
framework = arduino
board = esp32-c3-devkitm-1

; The frozen Tree 1 export uses C++17 inline constexpr variables.
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

lib_deps =
    pololu/LSM6
    pololu/LIS3MDL

upload_port = COM6
monitor_port = COM6
monitor_speed = 115200
upload_speed = 460800
